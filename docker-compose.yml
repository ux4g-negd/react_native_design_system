version: '3.8'

services:
  storybook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
